<!DOCTYPE html>
<!--
  ┌─────────────────────────────────────────────────────────────────────────┐
  │  Google Search Console — HTML File Verification                         │
  │                                                                         │
  │  HOW TO USE:                                                            │
  │  1. Go to Google Search Console → Add Property → URL prefix            │
  │  2. Select "HTML file" verification method                              │
  │  3. Google will give you a file named  google[code].html               │
  │     e.g.  google1a2b3c4d5e6f7890.html                                  │
  │  4. Rename THIS file to match that exact filename                       │
  │  5. Replace the <meta> content below with the one Google provides      │
  │  6. Commit & deploy — Google will verify it at:                        │
  │     https://potatoapparel.com/google[code].html                        │
  │                                                                         │
  │  ALTERNATIVE (no file needed):                                          │
  │  Use the meta-tag method instead — set NEXT_PUBLIC_GSC_VERIFICATION    │
  │  in your .env.local or Vercel env vars (see [locale]/layout.tsx)       │
  └─────────────────────────────────────────────────────────────────────────┘
-->
<html>
  <head>
    <meta name="google-site-verification" content="REPLACE_WITH_YOUR_VERIFICATION_CODE" />
  </head>
  <body>
    Google Search Console verification file for potatoapparel.com
  </body>
</html>
