name: Supabase Keep-Alive

# Free Supabase projects auto-pause after 7 days with no activity, which would
# silently break the lead form. This workflow pings the database every day so
# the project never goes idle long enough to pause. Daily is well inside the
# 7-day window even if a run is occasionally delayed.

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC (14:00 China time)
  workflow_dispatch: {}    # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # The URL and publishable key below are public by design (the same anon
        # key already ships in the website's browser bundle), so it is safe to
        # keep them here. RLS blocks reads, so this returns an empty result —
        # but the request itself counts as activity and keeps the project awake.
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://tzztaxplhtccrbmbkeot.supabase.co/rest/v1/inquiries?select=id&limit=1" \
            -H "apikey: sb_publishable_tvzMedrePih5XneOeX3anA_sc5MpeZy" \
            -H "Authorization: Bearer sb_publishable_tvzMedrePih5XneOeX3anA_sc5MpeZy")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "::error::Supabase returned $code — project may be paused or down"
            exit 1
          fi
